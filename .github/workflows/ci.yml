name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/chaos/aether_core_rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install maturin

      - name: Build & install the Rust core (aether_core_rs)
        # `maturin develop` needs an active virtualenv, which CI has none of.
        # Build a wheel and pip-install it into the runner's Python instead, so
        # every later step imports the compiled core without a venv.
        run: |
          maturin build --release --out dist \
            --manifest-path core/chaos/aether_core_rs/Cargo.toml
          pip install dist/*.whl

      - name: Run unit tests (pytest)
        run: pytest -q

      - name: Validate the NIST SP 800-22 implementation
        run: python -m tests.validate_nist

      - name: Smoke-test the entropy engine against the NIST suite
        run: python tests/nist_sp800_22.py --bits 1000000 --source nihde
